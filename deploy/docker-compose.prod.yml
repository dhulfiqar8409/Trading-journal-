# Production compose file for the Darkpools host. Lives at /opt/darkpools/docker-compose.yml.
# The image is built by GitHub Actions (release workflow) and pulled here; nothing builds on the server.
services:
  app:
    image: ghcr.io/dhulfiqar8409/darkpools:latest
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://darkpools:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/darkpools
      UPLOAD_DIR: /app/uploads
      PORT: "3000"
    ports:
      - "127.0.0.1:${APP_PORT:-3300}:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: darkpools
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: darkpools
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=20
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkpools -d darkpools"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
  uploads:
