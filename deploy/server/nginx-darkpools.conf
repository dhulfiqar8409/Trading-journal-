# Darkpools trading journal: darkpools.deeapps.net -> 127.0.0.1:3300
# Own file; the other applications' server blocks are not touched.
server {
    listen 80; listen [::]:80;
    server_name darkpools.deeapps.net;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name darkpools.deeapps.net;
    ssl_certificate /etc/nginx/ssl/acm-cert.pem; ssl_certificate_key /etc/nginx/ssl/acm-key.pem;
    client_max_body_size 12m;   # screenshot uploads are capped at 10 MB by the app
    location / { include /etc/nginx/snippets/app-proxy.conf; proxy_pass http://127.0.0.1:3300; }
}
