# Darkpools trading journal: darkpools.deeapps.net -> 127.0.0.1:3300
# Own file; the other applications' server blocks are not touched.
server {
    listen 80; listen [::]:80;
    server_name darkpools.deeapps.net;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name darkpools.deeapps.net;
    ssl_certificate /etc/nginx/ssl/acm-cert.pem; ssl_certificate_key /etc/nginx/ssl/acm-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSLDARKPOOLS:5m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    client_max_body_size 12m;   # screenshot uploads are capped at 10 MB by the app

    # Brute-force protection for the login and first-run setup pages: 5 requests a minute
    # per address with a burst of 10, then HTTP 429. The app adds per-account lockout on top.
    location = /login {
        limit_req zone=darkpools_login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/app-proxy.conf; proxy_pass http://127.0.0.1:3300;
    }
    location = /setup {
        limit_req zone=darkpools_login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/app-proxy.conf; proxy_pass http://127.0.0.1:3300;
    }

    # Health endpoint stays internal; the updater checks it on 127.0.0.1:3300 directly.
    location = /api/health {
        allow 127.0.0.1; allow ::1; deny all;
        include /etc/nginx/snippets/app-proxy.conf; proxy_pass http://127.0.0.1:3300;
    }

    location / { include /etc/nginx/snippets/app-proxy.conf; proxy_pass http://127.0.0.1:3300; }
}
